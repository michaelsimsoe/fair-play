<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171717">
    <title>Fair Play</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #171717;
        color: #fafafa;
      }

      main {
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(3rem, 12vw, 7rem);
      }

      p {
        margin: 0;
        color: #a3a3a3;
        font-size: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fair Play</h1>
      <p>The first version is live.</p>
    </main>
  </body>
</html>
